{% extends "base.html" %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card p-5 shadow-sm border-0" style="border-radius: 16px;">
                <div class="mb-4">
                    <span class="badge bg-danger px-3 py-2 rounded-pill fs-6">Error 500</span>
                </div>
                <h1 class="display-5 fw-bold mb-3 text-danger">Internal Server Error</h1>
                <p class="text-muted mb-4 fs-6">
                    An unexpected error occurred while processing your request. The technical details have been safely logged.
                </p>
                <div class="d-flex gap-2 justify-content-center">
                    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2">
                        <i class="fas fa-home me-2"></i>Return to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
