{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Edit Product</h2>
    <a href="{{ url_for('products.index') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Product Name <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Brand</label>
                    <input type="text" name="brand" class="form-control" value="{{ product.brand }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label>HSN Code</label>
                    <input type="text" name="hsn_code" class="form-control" value="{{ product.hsn_code }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label>Warranty</label>
                    <input type="text" name="warranty" class="form-control" value="{{ product.warranty }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label>Unit</label>
                    <input type="text" name="unit" class="form-control" value="{{ product.unit }}">
                </div>
                
                <h5 class="mt-3 mb-3 border-bottom pb-2">Pricing & Stock</h5>
                
                <div class="col-md-3 mb-3">
                    <label>GST %</label>
                    <input type="number" step="0.01" name="gst_percent" id="gst_percent" class="form-control" value="{{ product.gst_percent }}">
                </div>
                <div class="col-md-9 mb-3"></div> <!-- spacer -->

                <div class="col-md-3 mb-3">
                    <label class="text-danger fw-bold">Dealer Price (with GST)</label>
                    <input type="number" step="0.01" name="dealer_price" id="dealer_price" class="form-control" value="{{ product.dealer_price }}">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="text-danger">Dealer Price (w/o GST)</label>
                    <input type="number" step="0.01" id="dealer_price_ex_gst" class="form-control" value="0">
                </div>
                
                <div class="col-md-3 mb-3">
                    <label class="text-success fw-bold">Selling Price (with GST)</label>
                    <input type="number" step="0.01" name="customer_price" id="customer_price" class="form-control" value="{{ product.customer_price }}">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="text-success">Selling Price (w/o GST)</label>
                    <input type="number" step="0.01" id="customer_price_ex_gst" class="form-control" value="0">
                </div>
                <div class="col-md-4 mb-3">
                    <label>Stock Quantity</label>
                    <input type="number" name="stock" class="form-control" value="{{ product.stock }}">
                </div>
                <div class="col-md-8 mb-3">
                    <label>Notes</label>
                    <input type="text" name="notes" class="form-control" value="{{ product.notes }}">
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Update Product</button>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const gstInput = document.getElementById('gst_percent');
    const dealerInc = document.getElementById('dealer_price');
    const dealerEx = document.getElementById('dealer_price_ex_gst');
    const customerInc = document.getElementById('customer_price');
    const customerEx = document.getElementById('customer_price_ex_gst');

    function updateExGST(incInput, exInput) {
        const gst = parseFloat(gstInput.value) || 0;
        const incVal = parseFloat(incInput.value) || 0;
        exInput.value = (incVal / (1 + gst / 100)).toFixed(2);
    }

    function updateIncGST(exInput, incInput) {
        const gst = parseFloat(gstInput.value) || 0;
        const exVal = parseFloat(exInput.value) || 0;
        incInput.value = (exVal * (1 + gst / 100)).toFixed(2);
    }

    // Initialize values
    updateExGST(dealerInc, dealerEx);
    updateExGST(customerInc, customerEx);

    dealerInc.addEventListener('input', () => updateExGST(dealerInc, dealerEx));
    dealerEx.addEventListener('input', () => updateIncGST(dealerEx, dealerInc));
    customerInc.addEventListener('input', () => updateExGST(customerInc, customerEx));
    customerEx.addEventListener('input', () => updateIncGST(customerEx, customerInc));
    gstInput.addEventListener('input', () => {
        updateExGST(dealerInc, dealerEx);
        updateExGST(customerInc, customerEx);
    });
});
</script>
{% endblock %}
