{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Add Customer</h2>
    <a href="{{ url_for('customers.index') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST" action="{{ url_for('customers.add') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Name <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Mobile <span class="text-danger">*</span></label>
                    <input type="text" name="mobile" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Contact Person</label>
                    <input type="text" name="contact_person" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Alternate Mobile</label>
                    <input type="text" name="alternate_number" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label>GSTIN</label>
                    <input type="text" name="gst_number" class="form-control">
                </div>
                <div class="col-md-12 mb-3">
                    <label>Address</label>
                    <textarea name="address" class="form-control" rows="2"></textarea>
                </div>
                <div class="col-md-4 mb-3">
                    <label>City</label>
                    <input type="text" name="city" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label>State</label>
                    <input type="text" name="state" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label>Pin Code</label>
                    <input type="text" name="pin_code" class="form-control">
                </div>
                <div class="col-md-12 mb-3">
                    <label>Site Location</label>
                    <input type="text" name="site_location" class="form-control">
                </div>
            </div>
            <button type="submit" class="btn btn-success">Save Customer</button>
        </form>
    </div>
</div>
{% endblock %}
